# Hygraph CMS Content Model
# This file documents the schema created in Hygraph (https://hygraph.com)

type Bookmark {
    id: ID!
    title: String!
    slug: String!
    description: String
    link: String!
    read: Boolean!
    private: Boolean!
    tags: [Tag!]
    type: BookmarkGroup
    createdAt: DateTime!
    updatedAt: DateTime!
}

type BookmarkGroup {
    id: ID!
    title: String!
    slug: String!
    description: String
    createdAt: DateTime!
    updatedAt: DateTime!
}

type Tag {
    id: ID!
    tag: String!
    createdAt: DateTime!
    updatedAt: DateTime!
}

# Query examples (see src/lib/queries/bookmarks.ts for actual implementations)
type Query {
    bookmarks(first: Int, where: BookmarkWhereInput, orderBy: BookmarkOrderByInput): [Bookmark!]!
    bookmark(where: BookmarkWhereUniqueInput!): Bookmark
    bookmarkGroups(first: Int, orderBy: BookmarkGroupOrderByInput): [BookmarkGroup!]!
    tags(orderBy: TagOrderByInput): [Tag!]!
}

# Mutation examples (see src/lib/queries/bookmarks.ts for actual implementations)
type Mutation {
    createBookmark(data: BookmarkCreateInput!): Bookmark!
    publishBookmark(where: BookmarkWhereUniqueInput!, to: Stage!): Bookmark!
    updateBookmark(where: BookmarkWhereUniqueInput!, data: BookmarkUpdateInput!): Bookmark!
    deleteBookmark(where: BookmarkWhereUniqueInput!): Bookmark!
}

